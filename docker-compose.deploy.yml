# Produção na VPS: https://jpsys.duckdns.org/entrelinhas (e pelo IP).
# O Traefik central (projeto traefikproxy) termina o HTTPS, emite os certificados e roteia pelos
# labels abaixo; este projeto não publica porta nenhuma nem tem proxy próprio. Segredos chegam do
# GitHub Actions no .env.production (modo 600).
#   docker compose -f docker-compose.deploy.yml --env-file .env.production up -d
#
# A rede traefik_proxy é dividida com outros sistemas, e o Docker registra o nome de cada serviço
# como nome de rede em todas as redes dele. Por isso os serviços que entram nela têm nome único
# (entrelinhas-api). A API não tem rota pública: o Traefik expõe dela apenas o Django Admin e os
# estáticos dele; o resto de /entrelinhas é do front (entrelinhas-web).
# Fotos (T0501) pedirão um bucket no SILO (rede infra_storage); ainda não entra aqui.
name: project-entrelinhas

x-origens: &origens https://jpsys.duckdns.org,https://217.216.82.25

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: entrelinhas
      POSTGRES_USER: entrelinhas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U entrelinhas -d entrelinhas]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      internal:
        aliases: [entrelinhas-db]

  entrelinhas-api:
    build: ./backend
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Configure DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: jpsys.duckdns.org,217.216.82.25,entrelinhas-api,localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: *origens
      # O Traefik já redireciona para HTTPS; o BFF fala com a API por HTTP na rede interna.
      DJANGO_SSL_REDIRECT: 'false'
      DJANGO_PREFIXO_URL: entrelinhas
      POSTGRES_HOST: entrelinhas-db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Fotos privadas (spec 004): volume só da API, fora de qualquer pasta pública; entra no backup do deploy.
      FOTOS_DIR: /data/fotos
    volumes: [fotos_data:/data/fotos]
    depends_on:
      db: {condition: service_healthy}
    networks:
      internal:
        aliases: [entrelinhas-api]
      traefik_proxy: {}
    labels:
      traefik.enable: 'true'
      traefik.docker.network: traefik_proxy
      traefik.http.services.entrelinhas-api.loadbalancer.server.port: '8000'
      # Só o Django Admin e os estáticos dele.
      traefik.http.routers.entrelinhas-admin-duckdns.rule: Host(`jpsys.duckdns.org`) && (PathPrefix(`/entrelinhas/admin/`) || PathPrefix(`/entrelinhas/django-static/`))
      traefik.http.routers.entrelinhas-admin-duckdns.entrypoints: websecure
      traefik.http.routers.entrelinhas-admin-duckdns.tls: 'true'
      traefik.http.routers.entrelinhas-admin-duckdns.tls.certresolver: duckdns
      traefik.http.routers.entrelinhas-admin-duckdns.priority: '200'
      traefik.http.routers.entrelinhas-admin-duckdns.middlewares: secure-headers@file
      traefik.http.routers.entrelinhas-admin-duckdns.service: entrelinhas-api
      traefik.http.routers.entrelinhas-admin-ip.rule: Host(`217.216.82.25`) && (PathPrefix(`/entrelinhas/admin/`) || PathPrefix(`/entrelinhas/django-static/`))
      traefik.http.routers.entrelinhas-admin-ip.entrypoints: websecure
      traefik.http.routers.entrelinhas-admin-ip.tls: 'true'
      traefik.http.routers.entrelinhas-admin-ip.priority: '200'
      traefik.http.routers.entrelinhas-admin-ip.middlewares: secure-headers@file
      traefik.http.routers.entrelinhas-admin-ip.service: entrelinhas-api
      # Limite de tentativas de senha no login do Admin (spec 002, ABU-4): só o POST do formulário,
      # 5 por minuto por endereço (resposta 429 depois). Um roteador próprio, mais prioritário que o
      # do Admin, para não limitar os estáticos nem a navegação.
      traefik.http.middlewares.entrelinhas-login-limite.ratelimit.average: '5'
      traefik.http.middlewares.entrelinhas-login-limite.ratelimit.period: 1m
      traefik.http.middlewares.entrelinhas-login-limite.ratelimit.burst: '5'
      traefik.http.routers.entrelinhas-login-duckdns.rule: Host(`jpsys.duckdns.org`) && Method(`POST`) && Path(`/entrelinhas/admin/login/`)
      traefik.http.routers.entrelinhas-login-duckdns.entrypoints: websecure
      traefik.http.routers.entrelinhas-login-duckdns.tls: 'true'
      traefik.http.routers.entrelinhas-login-duckdns.tls.certresolver: duckdns
      traefik.http.routers.entrelinhas-login-duckdns.priority: '300'
      traefik.http.routers.entrelinhas-login-duckdns.middlewares: entrelinhas-login-limite@docker,secure-headers@file
      traefik.http.routers.entrelinhas-login-duckdns.service: entrelinhas-api
      traefik.http.routers.entrelinhas-login-ip.rule: Host(`217.216.82.25`) && Method(`POST`) && Path(`/entrelinhas/admin/login/`)
      traefik.http.routers.entrelinhas-login-ip.entrypoints: websecure
      traefik.http.routers.entrelinhas-login-ip.tls: 'true'
      traefik.http.routers.entrelinhas-login-ip.priority: '300'
      traefik.http.routers.entrelinhas-login-ip.middlewares: entrelinhas-login-limite@docker,secure-headers@file
      traefik.http.routers.entrelinhas-login-ip.service: entrelinhas-api
      # HTTP → HTTPS do Admin, pelo middleware central.
      traefik.http.routers.entrelinhas-http.rule: PathPrefix(`/entrelinhas/`)
      traefik.http.routers.entrelinhas-http.entrypoints: web
      traefik.http.routers.entrelinhas-http.middlewares: redirect-to-https@file
      traefik.http.routers.entrelinhas-http.service: entrelinhas-api

  # O app (Flutter web) e o repasse de /api/ para a API, numa só origem (ADR-0006). O Traefik tira o
  # prefixo /entrelinhas; o Admin (prioridade 200) e o limite de entrada (300) vencem o app (10).
  entrelinhas-web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
      args:
        BASE_HREF: /entrelinhas/
        API_BASE: /entrelinhas/api/v1
    restart: unless-stopped
    environment:
      API_UPSTREAM: entrelinhas-api:8000
    depends_on:
      entrelinhas-api: {condition: service_started}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:80/healthz']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      internal:
        aliases: [entrelinhas-web]
      traefik_proxy: {}
    labels:
      traefik.enable: 'true'
      traefik.docker.network: traefik_proxy
      traefik.http.services.entrelinhas-web.loadbalancer.server.port: '80'
      traefik.http.middlewares.entrelinhas-prefixo.stripprefix.prefixes: /entrelinhas
      traefik.http.middlewares.entrelinhas-barra.redirectregex.regex: ^(https://[^/]+)/entrelinhas$$
      traefik.http.middlewares.entrelinhas-barra.redirectregex.replacement: $${1}/entrelinhas/
      traefik.http.middlewares.entrelinhas-barra.redirectregex.permanent: 'true'
      # Entrar e aceitar convite (spec 003, ABU-1): balde de 5 fichas, uma a cada 12 s.
      traefik.http.middlewares.entrelinhas-entrar-limite.ratelimit.average: '5'
      traefik.http.middlewares.entrelinhas-entrar-limite.ratelimit.period: 1m
      traefik.http.middlewares.entrelinhas-entrar-limite.ratelimit.burst: '5'
      traefik.http.routers.entrelinhas-web-duckdns.rule: Host(`jpsys.duckdns.org`) && PathPrefix(`/entrelinhas`)
      traefik.http.routers.entrelinhas-web-duckdns.entrypoints: websecure
      traefik.http.routers.entrelinhas-web-duckdns.tls: 'true'
      traefik.http.routers.entrelinhas-web-duckdns.tls.certresolver: duckdns
      traefik.http.routers.entrelinhas-web-duckdns.priority: '10'
      traefik.http.routers.entrelinhas-web-duckdns.middlewares: entrelinhas-barra@docker,entrelinhas-prefixo@docker,secure-headers@file
      traefik.http.routers.entrelinhas-web-duckdns.service: entrelinhas-web
      traefik.http.routers.entrelinhas-web-ip.rule: Host(`217.216.82.25`) && PathPrefix(`/entrelinhas`)
      traefik.http.routers.entrelinhas-web-ip.entrypoints: websecure
      traefik.http.routers.entrelinhas-web-ip.tls: 'true'
      traefik.http.routers.entrelinhas-web-ip.priority: '10'
      traefik.http.routers.entrelinhas-web-ip.middlewares: entrelinhas-barra@docker,entrelinhas-prefixo@docker,secure-headers@file
      traefik.http.routers.entrelinhas-web-ip.service: entrelinhas-web
      traefik.http.routers.entrelinhas-entrar-duckdns.rule: Host(`jpsys.duckdns.org`) && Method(`POST`) && (Path(`/entrelinhas/api/v1/auth/entrar`) || Path(`/entrelinhas/api/v1/convites/aceitar`))
      traefik.http.routers.entrelinhas-entrar-duckdns.entrypoints: websecure
      traefik.http.routers.entrelinhas-entrar-duckdns.tls: 'true'
      traefik.http.routers.entrelinhas-entrar-duckdns.tls.certresolver: duckdns
      traefik.http.routers.entrelinhas-entrar-duckdns.priority: '300'
      traefik.http.routers.entrelinhas-entrar-duckdns.middlewares: entrelinhas-entrar-limite@docker,entrelinhas-prefixo@docker,secure-headers@file
      traefik.http.routers.entrelinhas-entrar-duckdns.service: entrelinhas-web
      traefik.http.routers.entrelinhas-entrar-ip.rule: Host(`217.216.82.25`) && Method(`POST`) && (Path(`/entrelinhas/api/v1/auth/entrar`) || Path(`/entrelinhas/api/v1/convites/aceitar`))
      traefik.http.routers.entrelinhas-entrar-ip.entrypoints: websecure
      traefik.http.routers.entrelinhas-entrar-ip.tls: 'true'
      traefik.http.routers.entrelinhas-entrar-ip.priority: '300'
      traefik.http.routers.entrelinhas-entrar-ip.middlewares: entrelinhas-entrar-limite@docker,entrelinhas-prefixo@docker,secure-headers@file
      traefik.http.routers.entrelinhas-entrar-ip.service: entrelinhas-web

volumes:
  postgres_data:
  fotos_data:

networks:
  internal:
  traefik_proxy:
    external: true
