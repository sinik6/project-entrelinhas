openapi: 3.1.0
info:
  title: Entrelinhas — registros (mudança 005)
  version: 1.2.0
  description: Registros diários com visibilidade filtrada no servidor. Acrescenta rotas ao contrato; `GET /fotos/{id}/arquivo` da 004 passa a aceitar o parceiro quando o registro da foto é `full`.
servers:
  - url: /api/v1
security:
  - sessao: []
paths:
  /registros:
    post:
      operationId: entregarRegistro
      summary: Entrega o registro do dia (atômico)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NovoRegistro'}
      responses:
        '201':
          description: Registro criado, na visão do autor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegistroDoAutor'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '409': {$ref: '#/components/responses/Conflito'}
        '422': {$ref: '#/components/responses/Validacao'}
    get:
      operationId: listarRegistros
      summary: Registros do grupo no mês, na visão de quem pede
      parameters:
        - name: mes
          in: query
          required: true
          schema: {type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$'}
      responses:
        '200':
          description: Lista do mais novo para o mais antigo
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - {$ref: '#/components/schemas/RegistroDoAutor'}
                    - {$ref: '#/components/schemas/RegistroDoParceiro'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '422': {$ref: '#/components/responses/Validacao'}
  /registros/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: lerRegistro
      summary: Um registro, na visão de quem pede
      responses:
        '200':
          description: Registro filtrado
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/RegistroDoAutor'}
                  - {$ref: '#/components/schemas/RegistroDoParceiro'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
    put: {operationId: editarRegistro, summary: Não permitido, responses: {'405': {description: Registro entregue não se edita}}}
    patch: {operationId: alterarRegistro, summary: Não permitido, responses: {'405': {description: Registro entregue não se altera}}}
    delete: {operationId: apagarRegistro, summary: Não permitido, responses: {'405': {description: Registro entregue não se apaga}}}
components:
  securitySchemes:
    sessao:
      type: apiKey
      in: cookie
      name: entrelinhas_sessionid
  schemas:
    Autor:
      type: object
      required: [nome, cor]
      properties:
        nome: {type: string}
        cor: {type: string, pattern: '^#[0-9A-Fa-f]{6}$'}
        foto_url: {type: [string, 'null']}
    NovoRegistro:
      type: object
      required: [texto, visibilidade, fotos]
      properties:
        texto: {type: string, minLength: 1, maxLength: 20000}
        visibilidade: {type: string, enum: [full, private, partial]}
        trecho:
          type: object
          description: Só com visibilidade partial; pontos de código Unicode, [inicio, fim)
          required: [inicio, fim]
          properties:
            inicio: {type: integer, minimum: 0}
            fim: {type: integer, minimum: 1}
        fotos:
          type: array
          minItems: 1
          maxItems: 3
          items: {type: string, format: uuid}
    RegistroDoAutor:
      type: object
      required: [id, data, entregue_em, visibilidade, texto, fotos, autor, meu]
      properties:
        id: {type: string, format: uuid}
        data: {type: string, format: date}
        entregue_em: {type: string, format: date-time}
        visibilidade: {type: string, enum: [full, private, partial]}
        trecho: {type: [object, 'null'], properties: {inicio: {type: integer}, fim: {type: integer}}}
        texto: {type: string}
        fotos: {type: array, items: {type: string, format: uuid}}
        autor: {$ref: '#/components/schemas/Autor'}
        meu: {type: boolean, const: true}
    RegistroDoParceiro:
      type: object
      description: Nunca contém `texto`, `trecho` nem o tamanho do texto completo.
      required: [id, data, entregue_em, visibilidade_efetiva, texto_visivel, fotos, autor, meu]
      properties:
        id: {type: string, format: uuid}
        data: {type: string, format: date}
        entregue_em: {type: string, format: date-time}
        visibilidade_efetiva: {type: string, enum: [full, private, partial]}
        texto_visivel: {type: [string, 'null']}
        fotos: {type: array, items: {type: string, format: uuid}}
        autor: {$ref: '#/components/schemas/Autor'}
        meu: {type: boolean, const: false}
        aviso: {type: string}
    ErroCampos:
      type: object
      required: [campos]
      properties:
        campos: {type: object, additionalProperties: {type: array, items: {type: string}}}
    ErroDetalhe:
      type: object
      required: [detalhe]
      properties:
        detalhe: {type: string}
  responses:
    NaoAutenticado:
      description: Sem sessão
      content: {application/json: {schema: {$ref: '#/components/schemas/ErroDetalhe'}}}
    NaoEncontrado:
      description: Não existe ou a pessoa não pode ver
      content: {application/json: {schema: {$ref: '#/components/schemas/ErroDetalhe'}}}
    Conflito:
      description: Já entregou hoje, ou sem grupo
      content: {application/json: {schema: {$ref: '#/components/schemas/ErroDetalhe'}}}
    Validacao:
      description: Campo inválido (a mensagem não repete o texto enviado)
      content: {application/json: {schema: {$ref: '#/components/schemas/ErroCampos'}}}
