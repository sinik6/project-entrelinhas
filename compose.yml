# Ambiente de desenvolvimento: PostgreSQL + API (backend/) com recarga automática + app web (frontend/).
# Portas 5432 e 8000 costumam estar ocupadas por outros projetos nesta máquina: o banco não
# publica porta e a API sai em 8010 e o app em 8011.
#   docker compose up --build
name: entrelinhas

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-entrelinhas}
      POSTGRES_USER: ${POSTGRES_USER:-entrelinhas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-entrelinhas}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: postgres
      FOTOS_DIR: /data/fotos
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
      - fotos_data:/data/fotos
    user: root
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  # O app Flutter web e o repasse de /api/ para a API, numa só origem: http://localhost:8011
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
      args:
        BASE_HREF: /
        API_BASE: /api/v1
    depends_on:
      - api
    environment:
      API_UPSTREAM: api:8000
    ports:
      - "8011:80"

volumes:
  postgres_data:
  fotos_data:
