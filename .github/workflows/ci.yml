name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — lint e testes (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: entrelinhas
          POSTGRES_USER: entrelinhas
          POSTGRES_PASSWORD: ci-somente
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U entrelinhas -d entrelinhas"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-somente-chave-de-teste-nao-usar-em-producao-0123456789abcdef
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: ci-somente
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          working-directory: backend
      - name: Dependências
        run: uv sync --frozen
      - name: Lint e formatação
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Django (check, migrations, deploy)
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
          DJANGO_SETTINGS_MODULE=config.settings.prod DJANGO_SECRET_KEY=ci-somente-chave-longa-0123456789abcdef0123456789abcdef \
            DJANGO_ALLOWED_HOSTS=api.exemplo.com \
            uv run python manage.py check --deploy --fail-level WARNING
      - name: Testes
        run: uv run pytest --create-db

  frontend:
    name: Frontend — analyze e testes (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Imagem do SDK (versão fixa, SHA-256 conferido)
        run: docker build -t entrelinhas-flutter-sdk:local frontend
      - name: flutter analyze e flutter test
        run: |
          docker run --rm -v "$PWD/frontend:/app" entrelinhas-flutter-sdk:local \
            bash -c "flutter pub get && flutter analyze && flutter test"

  imagem:
    name: Build das imagens e compose de produção
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build da API
        run: docker build -t entrelinhas-api:ci backend
      - name: docker build do app web
        run: |
          docker build -t entrelinhas-flutter-sdk:local frontend
          docker build -f infra/web.Dockerfile -t entrelinhas-web:ci --build-arg BASE_HREF=/entrelinhas/ --build-arg API_BASE=/entrelinhas/api/v1 .
      - name: compose de produção válido
        env:
          POSTGRES_PASSWORD: validate-only
          DJANGO_SECRET_KEY: validate-only
        run: docker compose -f docker-compose.deploy.yml config > /dev/null
