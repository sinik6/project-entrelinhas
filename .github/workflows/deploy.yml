name: Deploy Entrelinhas

# Publica na VPS o commit que o CI acabou de aprovar na main — nunca código não testado.
# Também pode ser disparado à mão (Actions → Deploy Entrelinhas → Run workflow), sobre a main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: project-entrelinhas
  COMPOSE_FILE: docker-compose.deploy.yml

concurrency:
  group: entrelinhas-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate compose file
        env:
          POSTGRES_PASSWORD: validate-only
          DJANGO_SECRET_KEY: validate-only
        run: docker compose -f ${{ env.COMPOSE_FILE }} config > /dev/null

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ vars.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Ensure directory exists
        run: |
          ssh -i ~/.ssh/deploy_key ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} \
            "mkdir -p ~/${{ env.APP_NAME }} ~/backups/${{ env.APP_NAME }}; chmod 700 ~/backups/${{ env.APP_NAME }}"

      - name: Sync files to server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.venv/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='specs/' \
            --exclude='AGENTS.md' \
            --exclude='CLAUDE.md' \
            --exclude='backend/staticfiles/' \
            ./ ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:~/${{ env.APP_NAME }}/

      - name: Generate .env.production on server
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SENHA_ADMIN_INICIAL: ${{ secrets.SENHA_ADMIN_INICIAL }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          umask 077
          # Valores com aspas simples: o Compose não interpola `$` nem trata `#` como comentário, então
          # nenhum pedaço de senha vira aviso no log. Por isso, valor com aspa simples é recusado.
          # Variable com nome de segredo é erro: ela prevaleceria (ou confundiria) sobre o segredo.
          if printf '%s' "$VARS_JSON" | jq -e 'keys | any(test("^(DJANGO_SECRET_KEY|POSTGRES_PASSWORD|SENHA_ADMIN_INICIAL)$"))' >/dev/null; then
            echo "Há uma variable com nome de segredo no ambiente production: apague-a (segredo é só em Secrets)" >&2; exit 1
          fi
          if printf '%s' "$VARS_JSON" | jq -e --arg q "'" 'to_entries | any(.value | contains($q))' >/dev/null; then
            echo "Uma variable do ambiente production contém aspa simples: remova a aspa" >&2; exit 1
          fi
          if printf '%s' "$VARS_JSON" | jq -e 'to_entries | any(.value | test("[\r\n]"))' >/dev/null; then
            echo "Uma variable do ambiente production contém quebra de linha: remova-a" >&2; exit 1
          fi
          # vars do GitHub → NOME='valor' (menos as de infraestrutura do CI)
          printf '%s' "$VARS_JSON" | jq -r --arg q "'" '
            to_entries
            | map(select(.key | test("^(DEPLOY_HOST|DEPLOY_USER)$") | not))
            | .[] | "\(.key)=\($q)\(.value)\($q)"
          ' > /tmp/.env.production
          printf "APP_NAME='%s'\n" "$APP_NAME" >> /tmp/.env.production

          # segredos (não iteráveis): obrigatórios, sem quebra de linha e sem aspa simples
          for nome in DJANGO_SECRET_KEY POSTGRES_PASSWORD SENHA_ADMIN_INICIAL; do
            valor="${!nome}"
            if [ -z "$valor" ]; then echo "Segredo $nome não configurado no ambiente production" >&2; exit 1; fi
            if [[ "$valor" == *$'\n'* || "$valor" == *$'\r'* ]]; then echo "Segredo $nome tem quebra de linha" >&2; exit 1; fi
            if [[ "$valor" == *"'"* ]]; then echo "Segredo $nome contém aspa simples: gere outro valor sem aspa" >&2; exit 1; fi
            # Antes da spec 002 o arquivo não tinha aspas e o Compose "mastigava" cifrão e espaço seguido de
            # cerquilha. Se a senha do banco tinha isso, o Postgres já a guardou mastigada: aspas simples
            # passariam o valor cru e a API deixaria de autenticar. Falha aqui, antes de tocar na VPS.
            if [ "$nome" = POSTGRES_PASSWORD ] && [[ "$valor" == *'$'* || "$valor" == *' #'* ]]; then
              echo "POSTGRES_PASSWORD contém cifrão ou espaço seguido de cerquilha: o valor efetivo mudaria com as aspas simples. Troque a senha do banco antes (ver spec 002, design, seção 15)" >&2; exit 1
            fi
            printf "%s='%s'\n" "$nome" "$valor" >> /tmp/.env.production
          done

          scp -i ~/.ssh/deploy_key /tmp/.env.production \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:~/${{ env.APP_NAME }}/.env.production
          ssh -i ~/.ssh/deploy_key ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} \
            "chmod 600 ~/${{ env.APP_NAME }}/.env.production"
          rm -f /tmp/.env.production
          echo "✅ .env.production gerado"

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} \
            "set -e; cd ~/${{ env.APP_NAME }}; bash infra/deploy.sh"
